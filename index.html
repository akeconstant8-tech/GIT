<!DOCTYPE html>
<html lang="Fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart DOM </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Mon panier</h1>
    
   <div class="Article">

    <div class="Article1 produit">
        <h2>Chaussure</h2>
        <p>Prix : <span class="prix">15000</span> FCFA</p>

        <button class="moins">-</button>
        <span class="quantite">1</span>
        <button class="plus">+</button>

        <button class="supprimer">Supprimer</button>
        <button class="coeur">❤</button>
    </div>

    <div class="Article2 produit">
        <h2>Portefeuille</h2>
        <p>Prix : <span class="prix">10000</span> FCFA</p>

        <button class="moins">-</button>
        <span class="quantite">1</span>
        <button class="plus">+</button>

        <button class="supprimer">Supprimer</button>
        <button class="coeur">❤</button>
    </div>

    <div class="Article3 produit">
        <h2>Sac à dos</h2>
        <p>Prix : <span class="prix">19000</span> FCFA</p>

        <button class="moins">-</button>
        <span class="quantite">1</span>
        <button class="plus">+</button>

        <button class="supprimer">Supprimer</button>
        <button class="coeur">❤</button>
    </div>

    <h2>total : <span id="total">44000</span> FCFA</h2>
    </div>
            <script src="script.Js"></script>
    
</body>
</html>
